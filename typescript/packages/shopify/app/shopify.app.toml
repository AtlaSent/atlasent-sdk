# Default read-only order preview. Pair with npm run serve.
# Replace every REPLACE_ value, then link and deploy with the Shopify CLI
# (`shopify app config link`, `shopify app deploy`). See ../README.md.

client_id = "REPLACE_WITH_CLIENT_ID"
name = "AtlaSent Order Preview"
handle = "atlasent-order-preview"
application_url = "https://REPLACE_WITH_YOUR_TUNNEL_OR_HOST"
embedded = true

[access_scopes]
# Only order reads. No refunds, seed mutations or customer notifications.
scopes = "read_orders"

[auth]
redirect_urls = ["https://REPLACE_WITH_YOUR_TUNNEL_OR_HOST/auth/callback"]

[webhooks]
api_version = "2025-10"
