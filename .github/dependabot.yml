version: 2
updates:
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
      # atlasent-sdk#506/#507: vitest and @vitest/coverage-v8 peer-depend on
      # each other at an EXACT matching version (coverage-v8@5.0.0 requires
      # vitest@5.0.0 exactly) but major bumps aren't covered by the
      # minor-and-patch group above, so Dependabot opened them as two
      # separate PRs -- neither installs standalone (npm ERESOLVE). Group
      # every vitest-family major bump together so they land as one PR.
      # These plugins require the exact size-limit version; upgrade together.
      size-limit-major:
        patterns:
          - "size-limit"
          - "@size-limit/*"
        update-types:
          - major
      vitest-major:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - major
    ignore:
      # atlasent-sdk#483: jsdom 30.0.1 raised its Node requirement to
      # ^22.22.2 || ^24.15.0 || >=26, which drops support for Node 20 --
      # a version this package's own engines field (>=18) still declares
      # supported and CI still verifies. A prior Dependabot major-bump PR
      # (#474) installed with engine warnings on Node 20 and broke the
      # browser-test worker (jsdom/undici
      # "webidl.util.markAsUncloneable is not a function"). Decided
      # (#483): preserve the current Node support contract rather than
      # silently raise the floor to accept a dev/test dependency bump.
      # Remove this ignore rule only alongside a deliberate, separately
      # reviewed Node-floor change (semver/release/customer compatibility
      # treatment) that also upgrades CI's Node matrix.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    groups:
      pip-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
