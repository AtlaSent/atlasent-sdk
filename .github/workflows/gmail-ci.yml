name: Gmail CI

# @atlasent/gmail's tests did not run anywhere before this workflow:
# typescript-ci.yml covers only the root package's test/**, and
# publish-npm-gmail.yml runs no tests. The package depends on the core SDK
# through `file:../../`, which resolves to its built dist, so core changes
# trigger this too and core is built first.

on:
  push:
    branches: [main]
    paths:
      - "typescript/packages/gmail/**"
      - "typescript/src/**"
      - "typescript/package.json"
      - "typescript/package-lock.json"
      - ".github/workflows/gmail-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "typescript/packages/gmail/**"
      - "typescript/src/**"
      - "typescript/package.json"
      - "typescript/package-lock.json"
      - ".github/workflows/gmail-ci.yml"

permissions:
  contents: read

jobs:
  ts-gmail:
    name: "TS gmail / Node ${{ matrix.node-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript/packages/gmail/package-lock.json

      - name: Build the core SDK the package links to
        working-directory: typescript
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: typescript/packages/gmail
        run: npm ci

      - name: Typecheck
        working-directory: typescript/packages/gmail
        run: npm run typecheck

      - name: Test
        working-directory: typescript/packages/gmail
        run: npm test

      - name: Build
        working-directory: typescript/packages/gmail
        run: npm run build
