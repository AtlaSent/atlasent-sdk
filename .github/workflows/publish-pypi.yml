name: Publish to PyPI

# Triggers only on Python-prefixed tags so the matching TypeScript
# workflow doesn't also fire on the same push. Release procedure: see
# /RELEASING.md.
on:
  push:
    tags:
      - "python-v*"
      # `python-v*` also matches atlasent-v2-alpha's `python-v2-alpha-v*`
      # tags, which would start a doomed main-SDK publish (tag/version
      # mismatch) on every v2-alpha release. That package has its own
      # workflow (publish-pypi-v2alpha.yml).
      - "!python-v2-alpha-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.0.0)'
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Run tests before publishing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    environment: pypi
    # OIDC trusted publishing — no PYPI_TOKEN secret, no long-lived
    # credentials. Configure the trusted publisher once in PyPI:
    # https://pypi.org/manage/account/publishing/
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      # Before anything else: refuse unless the dispatcher (and anyone
      # re-running this attempt) is on .github/production-dispatchers.json.
      - name: Production dispatcher must be on the allowlist
        uses: ./.github/actions/production-dispatcher-check

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        # GITHUB_REF is refs/tags/python-v<semver>. Strip the prefix and
        # compare against atlasent._version.__version__. Refuses to
        # publish if they disagree — protects against tagging a commit
        # that forgot the version bump.
        #
        # Skipped for workflow_dispatch runs (no tag ref).
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/python-v}"
          # Read _version.py directly without importing the full package
          # (avoids needing httpx/pydantic installed at this step)
          PKG_VERSION="$(python -c 'import runpy; print(runpy.run_path("atlasent/_version.py")["__version__"])')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match atlasent._version.__version__ ($PKG_VERSION)."
            exit 1
          fi
          echo "Tag and package version agree: $PKG_VERSION"

      - name: Verify manual version matches package version
        # For workflow_dispatch runs, verify the supplied version matches
        # the package's _version.py so the caller doesn't accidentally
        # publish a stale version.
        if: github.event_name == 'workflow_dispatch'
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION="$(python -c 'import runpy; print(runpy.run_path("atlasent/_version.py")["__version__"])')"
          if [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Input version ($INPUT_VERSION) does not match atlasent._version.__version__ ($PKG_VERSION)."
            exit 1
          fi
          # The AtlaSent release gate below reads context.ref from
          # github.ref directly (not from this version input), and the
          # org's package.release policy for this workflow requires a
          # python-v<semver> tag ref. A dispatch from a non-tag ref (e.g.
          # main) whose _version.py happens to already read the target
          # version would pass the check above yet still fail downstream
          # with a confusing gate denial, since github.ref never matched a
          # tag. Fail here instead, with an actionable error, before
          # wasting a build on a run that can't pass the gate.
          EXPECTED_REF="refs/tags/python-v${INPUT_VERSION}"
          if [ "${{ github.ref }}" != "$EXPECTED_REF" ]; then
            echo "::error::workflow_dispatch must be run FROM the release tag $EXPECTED_REF (select it as the dispatch ref), not from a branch. Got ${{ github.ref }}."
            exit 1
          fi
          echo "Input and package version agree: $PKG_VERSION"

      # ── AtlaSent release gate ────────────────────────────────────────
      # Gate closed: if the permit is not verified the job exits here and
      # nothing builds or publishes to PyPI.
      #
      # Action type is `package.release` (NOT production.deploy): package
      # publishing has its own runtime policy that does not require PR
      # approvals, whereas production.deploy keeps its human-approval gate.
      # The policy reads context.ref + context.event_name + context.workflow
      # (auto-populated by the action) and actor_id (github:<actor>); the
      # trusted-ref/workflow templates match the workflow NAME above
      # ("Publish to PyPI") — keep `name:` and the policy in sync.
      #
      # The 2026-06-20 emergency bypass that shipped 2.18.0 (PR #400) is
      # removed here — the gate is fully blocking again.
      #
      # UPDATE 2026-09-11: the permit-issuance gap this comment warned about
      # is fixed. atlasent-api#3304/#3305 found and closed the real bug: for
      # every action type OTHER than the mandatory-change-control set,
      # v1-evaluate never echoed execution_hash_expected on a
      # production-environment permit, so a plain evaluate-then-verify
      # round-trip structurally denied at verify time with
      # PAYLOAD_HASH_REQUIRED regardless of policy outcome -- the caller had
      # no way to learn what hash to re-present. Confirmed fixed
      # end-to-end, not just in isolation: atlasent-action's release.yml
      # gates on this exact same action type (package.release), the same
      # context shape, and the same org policy (see that file's own gate
      # step) -- its v1.6.0 release ran the full evaluate+verify+permit
      # flow after this fix landed and completed successfully (GitHub
      # Release created, floating v1 tag moved). This gate should now be
      # able to reach allow the same way, assuming this workflow's org
      # policy otherwise matches.
      - name: AtlaSent release gate
        uses: Atlasent/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          action: package.release
          api-url: https://kttccumlnmdtupgbyfue.supabase.co/functions/v1
          actor: ${{ github.actor }}
          environment: production
          # `package` selects this package's package.release template
          # (package_release_atlasent_sdk_*_pypi_tag_release_manager,
          # atlasent-api docs/runbooks/package_release_v10). Without it no
          # template matches and the gate denies. Keep it equal to the
          # PyPI project name.
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}", "package": "atlasent"}'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build twine "packaging>=24.2"

      - name: Build distribution packages
        run: python -m build

      - name: Check distribution packages
        run: twine check dist/*

      - name: Smoke-test built wheel
        # Install the freshly-built wheel in a clean venv and verify
        # the package imports cleanly and reports the expected version.
        # Catches MANIFEST.in / packaging regressions before we ship.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          SMOKE_VERSION="$(/tmp/smoke/bin/python -c 'import atlasent; print(atlasent.__version__)')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXPECTED="${{ github.event.inputs.version }}"
          else
            EXPECTED="${GITHUB_REF#refs/tags/python-v}"
          fi
          if [ "$SMOKE_VERSION" != "$EXPECTED" ]; then
            echo "::error::Installed wheel reports $SMOKE_VERSION, expected $EXPECTED."
            exit 1
          fi
          /tmp/smoke/bin/python -c 'from atlasent import protect, authorize, AtlaSentClient, AsyncAtlaSentClient, AtlaSentError, AtlaSentDeniedError'

      - name: Publish to PyPI (trusted publisher, OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          # PEP 740 attestations are generated and uploaded by default.
