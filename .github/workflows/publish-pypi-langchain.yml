name: Publish atlasent-langchain to PyPI

# Triggers only on langchain-py-v* tags so it is disjoint from:
#   - publish-pypi.yml           (python-v*       -> atlasent)
#   - publish-npm-langchain.yml  (langchain-v*    -> @atlasent/langchain, the TS pack)
# A single tag push therefore fires exactly one publisher.
#
# Release procedure: bump python/atlasent_langchain/pyproject.toml's
# [project].version, then `git tag langchain-py-v<version> && git push --tags`.
# Publishing is maintainer-gated by the act of pushing this specific tag --
# nothing publishes on a normal merge.
#
# This workflow closes a real gap found during a discoverability audit:
# python/atlasent_langchain has a complete pyproject.toml + README but, until
# this file, no CI mechanism could ever actually publish it to PyPI.
on:
  push:
    tags:
      - "langchain-py-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.6.0)"
        required: true
      skip_gate:
        description: 'EMERGENCY ONLY. Bypasses the AtlaSent deploy gate. Requires `reason`. Use only when the gate itself cannot be satisfied (see step comments).'
        type: boolean
        default: false
      reason:
        description: 'Required when skip_gate=true: why the gate is being bypassed. Recorded in the run log and step summary.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Run tests before publishing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: python/atlasent_langchain
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    environment: pypi
    # OIDC trusted publishing -- no PYPI_TOKEN secret. Configure the trusted
    # publisher once in PyPI for project `atlasent-langchain`, pointing at
    # this workflow file (publish-pypi-langchain.yml) and the `pypi`
    # environment: https://pypi.org/manage/account/publishing/
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: python/atlasent_langchain
    steps:
      - uses: actions/checkout@v7

      # Before anything else: refuse unless the dispatcher (and anyone
      # re-running this attempt) is on .github/production-dispatchers.json.
      - name: Production dispatcher must be on the allowlist
        uses: ./.github/actions/production-dispatcher-check

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read package version from pyproject.toml
        id: pkg_version
        run: |
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $PKG_VERSION"

      - name: Verify tag matches package version
        # GITHUB_REF is refs/tags/langchain-py-v<version>. There is no
        # _version.py in this package (unlike atlasent / atlasent_enforce);
        # the version lives only in pyproject.toml's [project].version.
        # Skipped for workflow_dispatch (no tag ref).
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/langchain-py-v}"
          PKG_VERSION="${{ steps.pkg_version.outputs.version }}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml [project].version ($PKG_VERSION)."
            exit 1
          fi
          echo "Tag and package version agree: $PKG_VERSION"

      - name: Verify manual version matches package version
        if: github.event_name == 'workflow_dispatch'
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION="${{ steps.pkg_version.outputs.version }}"
          if [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Input version ($INPUT_VERSION) does not match pyproject.toml [project].version ($PKG_VERSION)."
            exit 1
          fi
          # The AtlaSent release gate below reads context.ref from
          # github.ref directly (not from this version input), and the
          # org's package.release policy for this workflow requires a
          # langchain-py-v<semver> tag ref. A dispatch from a non-tag ref
          # (e.g. main) whose pyproject.toml happens to already read the
          # target version would pass the check above yet still fail
          # downstream with a confusing gate denial, since github.ref
          # never matched a tag. Fail here instead, with an actionable
          # error. This check is NOT gated by skip_gate -- it is a
          # correctness check independent of authorization, and a
          # skip_gate dispatch still needs to build/publish the version it
          # actually claims to.
          EXPECTED_REF="refs/tags/langchain-py-v${INPUT_VERSION}"
          if [ "${{ github.ref }}" != "$EXPECTED_REF" ]; then
            echo "::error::workflow_dispatch must be run FROM the release tag $EXPECTED_REF (select it as the dispatch ref), not from a branch. Got ${{ github.ref }}."
            exit 1
          fi
          echo "Input and package version agree: $PKG_VERSION"

      # -- AtlaSent release gate --------------------------------------
      # Gate closed: if the permit is not verified the job exits here and
      # nothing builds or publishes.
      #
      # Action type is `package.release` (NOT production.deploy), matching
      # publish-pypi.yml's documented reasoning (see that file's own AtlaSent
      # release gate comment): package publishing has its own runtime policy
      # that does not require PR approvals, whereas production.deploy keeps
      # its human-approval gate. publish-npm-langchain.yml (the TS sibling
      # package's gate) currently uses production.deploy instead -- flagged
      # by review as a pre-existing inconsistency in that file, not
      # reproduced here.
      #
      # NOTE: publish-pypi.yml's comment says the package.release policy's
      # trusted-workflow template is keyed in part to the workflow's `name:`
      # field. If that trust list is an explicit allowlist rather than a
      # pattern, the policy owner may need to add this workflow's name
      # ("Publish atlasent-langchain to PyPI") to it before this gate can
      # reach `allow` -- verify against the live policy before relying on
      # this gate for an actual release.
      - name: AtlaSent release gate
        if: ${{ !inputs.skip_gate }}
        uses: Atlasent/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          action: package.release
          api-url: https://kttccumlnmdtupgbyfue.supabase.co/functions/v1
          actor: ${{ github.actor }}
          environment: production
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}", "package": "atlasent-langchain"}'

      - name: Gate bypass warning
        if: ${{ inputs.skip_gate }}
        run: |
          if [ -z "${{ inputs.reason }}" ]; then
            echo "::error title=skip_gate requires reason::skip_gate=true was set with no reason. Re-dispatch with reason filled in."
            exit 1
          fi
          echo "::warning title=DEPLOY GATE BYPASSED::skip_gate=true — AtlaSent authorization gate was bypassed by ${{ github.actor }}. Reason: ${{ inputs.reason }}."
          echo "## ⚠️ DEPLOY GATE BYPASSED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Actor:** \`${{ github.actor }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Reason:** ${{ inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build twine "packaging>=24.2"

      - name: Build distribution packages
        run: python -m build

      - name: Check distribution packages
        run: twine check dist/*

      - name: Smoke-test built wheel
        # Install the freshly-built wheel in a clean venv and verify the
        # package imports cleanly and PyPI's installed metadata reports the
        # expected version. This package has no __version__ attribute of its
        # own, so the version check goes through importlib.metadata rather
        # than an attribute import (see publish-pypi.yml / publish-pypi-
        # enforce.yml, which check atlasent.__version__ / atlasent_enforce.__version__
        # instead, because those packages define one).
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          SMOKE_VERSION="$(/tmp/smoke/bin/python -c 'from importlib.metadata import version; print(version("atlasent-langchain"))')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXPECTED="${{ github.event.inputs.version }}"
          else
            EXPECTED="${GITHUB_REF#refs/tags/langchain-py-v}"
          fi
          if [ "$SMOKE_VERSION" != "$EXPECTED" ]; then
            echo "::error::Installed wheel reports $SMOKE_VERSION, expected $EXPECTED."
            exit 1
          fi
          /tmp/smoke/bin/python -c 'from atlasent_langchain import DenialResult, async_with_langchain_guard, with_langchain_guard'

      - name: Publish to PyPI (trusted publisher, OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/atlasent_langchain/dist/
          # PEP 740 attestations are generated and uploaded by default.
