name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - "contract/vectors/**"
      - "contract/schemas/**"
      - ".github/workflows/typescript-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "typescript/**"
      - "contract/vectors/**"
      - "contract/schemas/**"
      - ".github/workflows/typescript-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: typescript

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (src + test)
        run: npm run typecheck

      - name: Typecheck examples
        run: npm run typecheck:examples

      - name: Test (with coverage)
        run: npm run test:coverage

      # tsup 9 builds require Node >=22.18; tests above still cover Node 20.
      - name: Use Node.js 22 for the root SDK build
        if: matrix.node-version == '20.x'
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Build
        run: npm run build

      - name: Bundle size check
        # size-limit 13 requires Node >= 22 (uses fs.promises.glob);
        # the budget only needs to run once, on the newest matrix leg.
        if: matrix.node-version == '22.x'
        run: npm run size
