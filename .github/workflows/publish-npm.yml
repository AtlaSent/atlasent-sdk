name: Publish to npm

# Triggers only on TypeScript-prefixed tags so the matching PyPI
# workflow doesn't also fire on the same push. Release procedure: see
# /RELEASING.md.
on:
  push:
    tags:
      - "typescript-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.0.0)'
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Run tests before publishing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    needs: test
    environment: npm
    # id-token: write is required for:
    #   1. `npm publish --provenance` (Sigstore attestation linking the
    #      tarball to this workflow run via the npm registry).
    #   2. cosign keyless signing (Sigstore Fulcio + Rekor, R4).
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package version
        # GITHUB_REF is refs/tags/typescript-v<semver>. Strip the prefix
        # and compare against package.json "version". Refuses to publish
        # if they disagree — protects against tagging a commit that
        # forgot the version bump.
        #
        # Skipped for workflow_dispatch runs (no tag ref).
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/typescript-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi
          echo "Tag and package version agree: $PKG_VERSION"

      - name: Verify manual version matches package version
        # For workflow_dispatch runs, verify the supplied version matches
        # package.json so the caller doesn't accidentally publish a stale version.
        if: github.event_name == 'workflow_dispatch'
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Input version ($INPUT_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi
          # The AtlaSent release gate below reads context.ref from
          # github.ref directly (not from this version input), and the
          # org's package.release policy for this workflow requires a
          # typescript-v<semver> tag ref. A dispatch from a non-tag ref
          # (e.g. main) whose package.json happens to already read the
          # target version would pass the check above yet still fail
          # downstream with a confusing gate denial, since github.ref
          # never matched a tag. Fail here instead, with an actionable
          # error, before wasting a build on a run that can't pass the gate.
          EXPECTED_REF="refs/tags/typescript-v${INPUT_VERSION}"
          if [ "${{ github.ref }}" != "$EXPECTED_REF" ]; then
            echo "::error::workflow_dispatch must be run FROM the release tag $EXPECTED_REF (select it as the dispatch ref), not from a branch. Got ${{ github.ref }}."
            exit 1
          fi
          echo "Input and package version agree: $PKG_VERSION"

      # ── AtlaSent release gate ────────────────────────────────────────
      # Gate closed: if the permit is not verified the job exits here and
      # nothing builds or publishes.
      #
      # Action type is `package.release` (NOT production.deploy): package
      # publishing has its own runtime policy that does not require PR
      # approvals, whereas production.deploy keeps its human-approval gate.
      # The policy reads context.ref + context.event_name + context.workflow
      # (auto-populated by the action) and actor_id (github:<actor>); the
      # trusted-ref/workflow templates match the workflow NAME above
      # ("Publish to npm") — keep `name:` and the policy in sync. This repo
      # also publishes python-v* tags for the PyPI package under the same
      # release-manager identity (see publish-pypi.yml), so the runtime
      # template additionally requires a typescript-v<semver> tag prefix —
      # a python-v* tag must never authorize an npm release or vice versa.
      # See atlasent-api migration 20260958000000 for the corresponding
      # release-manager template (template G).
      #
      # BLOCKED as of 2026-09-22, and NOT by anything in this file. Template
      # G exists, is correct, and its migration is applied on runtime prod —
      # but release-manager templates are seeded PER ORGANIZATION, and that
      # migration seeds two tenants, neither of which is the one this
      # workflow's ATLASENT_API_KEY actually authenticates as. So every
      # publish here has denied with `No template condition matched` since
      # 2026-08-22 (3 npm attempts, plus the langchain/llamaindex PyPI
      # workflows on 2026-08-30), while sibling repos' release gates allow.
      # npm therefore still serves 2.16.0 from 2026-06-04 against a main at
      # 2.21.2 — a denied publish looks exactly like a quiet week.
      #
      # Do NOT try to make this pass from this file. Renaming this workflow
      # to match another pipeline's template would be a lie, and adding a
      # `signed_tag: true` context field would be a self-asserted claim of
      # exactly the kind this repo family repeatedly refuses (no client
      # sends that field and the runtime does not derive it, so the template
      # reading it is unsatisfiable by any atlasent-action caller). The fix
      # is to point this workflow's credential at the tenant that carries
      # template G — a GitHub secret change, founder-only. Diagnosis with
      # identifiers: atlasent-internal
      # planning/PACKAGE_RELEASE_GATE_ORG_TARGETING_2026-09-22.md.
      #
      # This was previously gated on `production.deploy`, the wrong
      # protected action for package publication (a release-control
      # inconsistency vs. publish-pypi.yml, corrected here rather than
      # worked around via workflow_dispatch or a gate bypass).
      - name: AtlaSent release gate
        uses: Atlasent/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          action: package.release
          api-url: https://kttccumlnmdtupgbyfue.supabase.co/functions/v1
          actor: ${{ github.actor }}
          environment: production
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}"}'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inspect tarball contents (dry-run)
        # `npm pack --dry-run` prints the exact file list that would
        # ship to the registry. Logged in CI so a missing `files` entry
        # or accidentally-included secret is visible in the Actions log
        # before we push to npm.
        run: npm pack --dry-run

      - name: Pack tarball for signing
        # Create the real tarball so cosign can sign it before we publish.
        run: npm pack

      # ── R4: cosign keyless signing ───────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign npm tarball (keyless, Sigstore Fulcio + Rekor)
        # cosign uses the GitHub Actions OIDC token — no long-lived key secret.
        # The bundle is a portable, verifiable record anchored in Rekor.
        run: |
          TARBALL="$(ls *.tgz | head -1)"
          cosign sign-blob \
            --yes \
            --bundle="${TARBALL}.bundle" \
            "${TARBALL}"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Verify signature
        run: |
          cosign verify-blob \
            --bundle="${TARBALL}.bundle" \
            --certificate-identity-regexp='https://github.com/(?i:atlasent)/atlasent-sdk/.github/workflows/publish-npm.yml@refs/(tags/typescript-v|heads/main).*' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            "${TARBALL}"

      - name: Upload signature bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball-cosign-bundle
          path: typescript/${{ env.TARBALL }}.bundle
          retention-days: 90

      # npm trusted publishing (OIDC): npm authenticates this workflow via the
      # job's id-token (already granted for provenance/cosign), so no NPM_TOKEN.
      # Requires npm >= 11.5.1 and a Trusted Publisher configured for this
      # package on npmjs.com (repo Atlasent/atlasent-sdk, this workflow file,
      # this job's environment).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Publish (with provenance)
        run: npm publish --access public --provenance
