name: Publish @atlasent/behavior to npm

# Triggers on behavior-core-v* tags (e.g. behavior-core-v1.0.0).
# This workflow is specific to the GA @atlasent/behavior package
# (typescript/packages/behavior).
#
# Disjoint from publish-npm-behavior.yml (behavior-v* tags, which
# handles @atlasent/behavior-emit) and all other existing tag patterns.
#
# Release procedure:
#   1. Bump version in typescript/packages/behavior/package.json
#   2. Commit and push to main
#   3. git tag behavior-core-v<version> && git push --tags
# The publish job verifies the tag matches package.json before publishing.
on:
  push:
    tags:
      - "behavior-core-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true


permissions:
  contents: read

jobs:
  test:
    name: Run tests before publishing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]
    defaults:
      run:
        working-directory: typescript/packages/behavior
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/packages/behavior/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  publish:
    name: Build and publish @atlasent/behavior to npm
    runs-on: ubuntu-latest
    needs: test
    environment: npm
    # id-token: write is required for:
    #   1. npm publish --provenance (Sigstore-backed npm provenance attestation)
    #   2. cosign keyless signing (Sigstore Fulcio + Rekor, R4)
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: typescript/packages/behavior
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: typescript/packages/behavior/package-lock.json
          registry-url: "https://registry.npmjs.org"

      # ── AtlaSent release gate ────────────────────────────────────────
      # Gate closed: if the permit is not verified the job exits here and
      # nothing builds or publishes.
      # This was previously gated on `production.deploy`, the wrong
      # protected action for package publication (same release-control
      # inconsistency corrected in publish-npm.yml/publish-pypi.yml —
      # see those files' comments). Corrected here to match, rather than
      # left in a permanently-guaranteed-deny state.
      - name: AtlaSent release gate

        uses: Atlasent/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          action: package.release
          api-url: https://kttccumlnmdtupgbyfue.supabase.co/functions/v1
          actor: ${{ github.actor }}
          environment: production
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}"}'


      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        # GITHUB_REF is refs/tags/behavior-core-v<semver>. Strip the prefix
        # and compare against package.json "version". Refuses to publish if
        # they disagree — protects against tagging a commit that forgot
        # the version bump.
        #
        # Skipped for workflow_dispatch runs (no tag ref).
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/behavior-core-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi
          echo "Tag and package version agree: $PKG_VERSION"

      - name: Verify manual version matches package version
        if: github.event_name == 'workflow_dispatch'
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Input version ($INPUT_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi
          # The AtlaSent release gate above reads context.ref from
          # github.ref directly (not from this version input), and the
          # org's package.release policy for this workflow requires a
          # behavior-core-v<semver> tag ref. A dispatch from a non-tag ref
          # (e.g. main) whose package.json happens to already read the
          # target version would pass the check above yet still fail
          # downstream with a confusing gate denial, since github.ref
          # never matched a tag. Fail here instead, with an actionable
          # error.
          EXPECTED_REF="refs/tags/behavior-core-v${INPUT_VERSION}"
          if [ "${{ github.ref }}" != "$EXPECTED_REF" ]; then
            echo "::error::workflow_dispatch must be run FROM the release tag $EXPECTED_REF (select it as the dispatch ref), not from a branch. Got ${{ github.ref }}."
            exit 1
          fi
          echo "Input and package version agree: $PKG_VERSION"

      - name: Build
        run: npm run build

      - name: Inspect tarball contents (dry-run)
        # Logs the exact file list that will ship to the registry.
        # A missing dist/ entry or accidentally-included file is visible
        # here before the package hits npm.
        run: npm pack --dry-run

      - name: Pack tarball for signing
        run: |
          npm pack
          echo "TARBALL=$(ls *.tgz | head -1)" >> "$GITHUB_ENV"

      # ── R4: cosign keyless signing ──────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign npm tarball (keyless, Sigstore Fulcio + Rekor)
        # Uses the GitHub Actions OIDC token — no long-lived key secret.
        # The bundle is a portable, verifiable record anchored in Rekor.
        run: |
          cosign sign-blob \
            --yes \
            --bundle="${TARBALL}.bundle" \
            "${TARBALL}"

      - name: Verify signature
        if: github.event_name == 'push'
        run: |
          cosign verify-blob \
            --bundle="${TARBALL}.bundle" \
            --certificate-identity-regexp='https://github.com/(?i:atlasent)/atlasent-sdk/.github/workflows/publish-npm-behavior-core.yml@refs/tags/behavior-core-v.*' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            "${TARBALL}"

      - name: Upload signature bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball-cosign-bundle-behavior-core
          path: typescript/packages/behavior/${{ env.TARBALL }}.bundle
          retention-days: 90

      # npm trusted publishing (OIDC): npm authenticates this workflow via the
      # job's id-token (already granted for provenance/cosign), so no NPM_TOKEN.
      # Requires npm >= 11.5.1 and a Trusted Publisher configured for this
      # package on npmjs.com (repo Atlasent/atlasent-sdk, this workflow file,
      # this job's environment).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Publish (with provenance)
        run: npm publish --access public --provenance
