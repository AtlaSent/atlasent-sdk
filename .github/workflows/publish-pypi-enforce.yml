name: Publish atlasent-enforce to PyPI

# Triggers only on enforce-py-v* tags so it is disjoint from:
#   - publish-pypi.yml        (python-v*      → atlasent)
#   - publish-npm-enforce.yml (enforce-v*     → @atlasent/enforce, the TS pack)
# A single tag push therefore fires exactly one publisher.
#
# Release procedure: bump python/atlasent_enforce/atlasent_enforce/_version.py,
# then `git tag enforce-py-v<version> && git push --tags`. Publishing is
# maintainer-gated by the act of pushing this specific tag — nothing publishes
# on a normal merge.
on:
  push:
    tags:
      - "enforce-py-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0a1)"
        required: true


permissions:
  contents: read

jobs:
  test:
    name: Run tests before publishing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: python/atlasent_enforce
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    environment: pypi
    # OIDC trusted publishing — no PYPI_TOKEN secret. Configure the trusted
    # publisher once in PyPI for project `atlasent-enforce`, pointing at this
    # workflow file (publish-pypi-enforce.yml) and the `pypi` environment:
    # https://pypi.org/manage/account/publishing/
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: python/atlasent_enforce
    steps:
      - uses: actions/checkout@v7

      # Before anything else: refuse unless the dispatcher (and anyone
      # re-running this attempt) is on .github/production-dispatchers.json.
      - name: Production dispatcher must be on the allowlist
        uses: ./.github/actions/production-dispatcher-check

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        # GITHUB_REF is refs/tags/enforce-py-v<version>. Strip the prefix and
        # compare against atlasent_enforce._version.__version__. Refuses to
        # publish if they disagree — protects against tagging a commit that
        # forgot the version bump. Skipped for workflow_dispatch (no tag ref).
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/enforce-py-v}"
          PKG_VERSION="$(python -c 'import runpy; print(runpy.run_path("atlasent_enforce/_version.py")["__version__"])')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match atlasent_enforce._version.__version__ ($PKG_VERSION)."
            exit 1
          fi
          echo "Tag and package version agree: $PKG_VERSION"

      - name: Verify manual version matches package version
        if: github.event_name == 'workflow_dispatch'
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION="$(python -c 'import runpy; print(runpy.run_path("atlasent_enforce/_version.py")["__version__"])')"
          if [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Input version ($INPUT_VERSION) does not match atlasent_enforce._version.__version__ ($PKG_VERSION)."
            exit 1
          fi
          # The AtlaSent release gate below reads context.ref from
          # github.ref directly (not from this version input), and the
          # org's package.release policy for this workflow requires an
          # enforce-py-v<semver> tag ref. A dispatch from a non-tag ref
          # (e.g. main) whose _version.py happens to already read the
          # target version would pass the check above yet still fail
          # downstream with a confusing gate denial, since github.ref
          # never matched a tag. Fail here instead, with an actionable
          # error, before wasting a build on a run that can't pass the gate.
          EXPECTED_REF="refs/tags/enforce-py-v${INPUT_VERSION}"
          if [ "${{ github.ref }}" != "$EXPECTED_REF" ]; then
            echo "::error::workflow_dispatch must be run FROM the release tag $EXPECTED_REF (select it as the dispatch ref), not from a branch. Got ${{ github.ref }}."
            exit 1
          fi
          echo "Input and package version agree: $PKG_VERSION"

      # ── AtlaSent release gate ────────────────────────────────────────
      # Gate closed: if the permit is not verified the job exits here and
      # nothing builds or publishes. Same dogfood gate as publish-pypi.yml.
      # This was previously gated on `production.deploy`, the wrong
      # protected action for package publication (same release-control
      # inconsistency corrected in publish-npm.yml/publish-pypi.yml —
      # see those files' comments). Corrected here to match, rather than
      # left in a permanently-guaranteed-deny state.
      - name: AtlaSent release gate

        uses: Atlasent/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          action: package.release
          api-url: https://kttccumlnmdtupgbyfue.supabase.co/functions/v1
          actor: ${{ github.actor }}
          environment: production
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}", "package": "atlasent-enforce"}'


      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build twine "packaging>=24.2"

      - name: Build distribution packages
        run: python -m build

      - name: Check distribution packages
        run: twine check dist/*

      - name: Smoke-test built wheel
        # Install the freshly-built wheel in a clean venv and verify the
        # package imports cleanly and reports the expected version. Catches
        # packaging regressions (dynamic version, py.typed) before we ship.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          SMOKE_VERSION="$(/tmp/smoke/bin/python -c 'import atlasent_enforce; print(atlasent_enforce.__version__)')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXPECTED="${{ github.event.inputs.version }}"
          else
            EXPECTED="${GITHUB_REF#refs/tags/enforce-py-v}"
          fi
          if [ "$SMOKE_VERSION" != "$EXPECTED" ]; then
            echo "::error::Installed wheel reports $SMOKE_VERSION, expected $EXPECTED."
            exit 1
          fi
          /tmp/smoke/bin/python -c 'from atlasent_enforce import Enforce'

      - name: Publish to PyPI (trusted publisher, OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/atlasent_enforce/dist/
          # PEP 740 attestations are generated and uploaded by default.
