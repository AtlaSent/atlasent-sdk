name: Publish @atlasent/enforce to npm

# Triggers only on enforce-v* tags. Tag pattern:
# enforce-vX.Y.Z (e.g. enforce-v1.0.0). Publishes under the
# `latest` dist-tag so `npm install @atlasent/enforce` resolves
# the current GA release.
#
# Disjoint from publish-npm.yml (typescript-v*) and
# publish-npm-v2alpha.yml (typescript-v2-alpha-v*) so a single tag
# push only triggers the right publisher.

on:
  push:
    tags:
      - "enforce-v*"
  workflow_dispatch:


permissions:
  contents: read

jobs:
  test:
    name: Run tests before publishing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]
    defaults:
      run:
        working-directory: typescript/packages/enforce
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/packages/enforce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    needs: test
    environment: npm-enforce
    # id-token: write is required for:
    #   1. `npm publish --provenance` (Sigstore-backed npm provenance).
    #   2. cosign keyless signing (Sigstore Fulcio + Rekor, R4).
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: typescript/packages/enforce
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: typescript/packages/enforce/package-lock.json
          registry-url: "https://registry.npmjs.org"

      # ── AtlaSent release gate ────────────────────────────────────────
      # Gate closed: if the permit is not verified the job exits here and
      # nothing builds or publishes.
      # This was previously gated on `production.deploy`, the wrong
      # protected action for package publication (same release-control
      # inconsistency corrected in publish-npm.yml/publish-pypi.yml —
      # see those files' comments). Corrected here to match, rather than
      # left in a permanently-guaranteed-deny state.
      - name: AtlaSent release gate

        uses: Atlasent/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          action: package.release
          api-url: https://kttccumlnmdtupgbyfue.supabase.co/functions/v1
          actor: ${{ github.actor }}
          environment: production
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}"}'


      - name: Install dependencies
        run: npm ci

      - name: Verify ref matches package version
        # Runs on every trigger (push AND workflow_dispatch). This
        # workflow's `workflow_dispatch` declares no inputs, so there's no
        # separate version value that could diverge from github.ref the
        # way the input-vs-ref bug fixed elsewhere in this repo describes
        # -- but until this change, the check was skipped entirely on
        # workflow_dispatch (previously guarded by
        # `if: github.event_name == 'push'`), so a manual dispatch from
        # any ref -- including a tag whose package.json was never bumped
        # to match it -- published whatever version.json said with zero
        # verification. Requiring the ref itself to be tag-shaped here
        # closes that gap without needing a version input.
        run: |
          case "${{ github.ref }}" in
            refs/tags/enforce-v*)
              TAG_VERSION="${GITHUB_REF#refs/tags/enforce-v}"
              ;;
            *)
              echo "::error::Must run FROM an enforce-v<semver> release tag (push that tag, or select it as the workflow_dispatch ref), not ${{ github.ref }}."
              exit 1
              ;;
          esac
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi
          echo "Tag and package version agree: $PKG_VERSION"

      - name: Build
        run: npm run build

      - name: Pack tarball for signing
        run: npm pack

      # ── R4: cosign keyless signing ──────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign npm tarball (keyless, Sigstore Fulcio + Rekor)
        run: |
          TARBALL="$(ls *.tgz | head -1)"
          cosign sign-blob \
            --yes \
            --bundle="${TARBALL}.bundle" \
            "${TARBALL}"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Verify signature
        run: |
          cosign verify-blob \
            --bundle="${TARBALL}.bundle" \
            --certificate-identity-regexp='https://github.com/(?i:atlasent)/atlasent-sdk/.github/workflows/publish-npm-enforce.yml@refs/tags/enforce-v.*' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            "${TARBALL}"

      - name: Upload signature bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball-cosign-bundle-enforce
          path: typescript/packages/enforce/${{ env.TARBALL }}.bundle
          retention-days: 90

      - name: Inspect tarball contents (dry-run)
        # `npm pack --dry-run` prints the exact file list that would
        # ship to the registry. Logged so a missing `files` entry or
        # accidentally-included secret is visible before publish.
        run: npm pack --dry-run

      # npm trusted publishing (OIDC): npm authenticates this workflow via the
      # job's id-token (already granted for provenance/cosign), so no NPM_TOKEN.
      # Requires npm >= 11.5.1 and a Trusted Publisher configured for this
      # package on npmjs.com (repo Atlasent/atlasent-sdk, this workflow file,
      # this job's environment).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Publish (latest dist-tag, with provenance)
        run: npm publish --access public --tag latest --provenance
