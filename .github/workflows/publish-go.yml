# Tag convention: go/vX.Y.Z (e.g. go/v1.0.0)
#
# Go sub-modules in a mono-repo MUST be tagged with the directory prefix.
# pkg.go.dev indexes this module at:
#   https://pkg.go.dev/github.com/Atlasent/atlasent-sdk/go
#
# To release:
#   git tag go/v1.0.0
#   git push origin go/v1.0.0
#
# The version after stripping the prefix (v1.0.0) is what consumers specify:
#   go get github.com/Atlasent/atlasent-sdk/go@v1.0.0

name: Publish Go SDK

on:
  push:
    tags:
      - 'go/v*'   # MUST use go/vX.Y.Z — required for pkg.go.dev sub-module indexing
  workflow_dispatch: # Safe verification path: runs setup-go + tests only; never publishes.

jobs:
  dry-run:
    name: Verify Go toolchain and tests (no publish)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      - name: Run tests
        working-directory: go
        run: go test ./...

  test-and-publish:
    if: github.event_name == 'push'
    name: Test and publish Go SDK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to upload release assets
      id-token: write   # required for cosign keyless signing (Sigstore OIDC)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      # ── AtlaSent release gate ────────────────────────────────────────
      # Gate closed: if the permit is not verified the job exits here and
      # nothing builds or publishes.
      #
      # This was previously gated on `production.deploy`, the wrong
      # protected action for package publication (same release-control
      # inconsistency corrected in publish-npm.yml/publish-pypi.yml —
      # see those files' comments). Corrected here to match, rather than
      # left in a permanently-guaranteed-deny state.
      - name: AtlaSent release gate
        uses: Atlasent/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          action: package.release
          api-url: https://kttccumlnmdtupgbyfue.supabase.co/functions/v1
          actor: ${{ github.actor }}
          environment: production
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}"}'

      - name: Run tests
        working-directory: go
        run: go test ./...

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"        # e.g. go/v1.0.0
          VERSION="${TAG#go/}"            # strips prefix → v1.0.0
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG  →  Version: $VERSION"

      - name: Prod the module proxy
        run: |
          # Requesting the module from the proxy causes pkg.go.dev to index it
          # within minutes. The || true prevents failure if the proxy hasn't
          # crawled the tag yet — it will catch up on its own.
          GOPROXY=https://proxy.golang.org \
            go list -m \
            "github.com/Atlasent/atlasent-sdk/go@${{ steps.version.outputs.version }}" \
            || echo "Proxy indexing in progress — pkg.go.dev will index within minutes"

      # ── R4: cosign keyless signing ───────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Download Go module zip from proxy
        # Download the canonical module zip (the same artifact consumers
        # fetch from the module proxy) so we can sign it with cosign.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MODULE="github.com/Atlasent/atlasent-sdk/go"
          # GOMODCACHE the zip to a known path
          go mod download -json "${MODULE}@${VERSION}" 2>/dev/null || true
          # Fall back: use the proxy download endpoint directly
          ENCODED_MODULE="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "${MODULE}")"
          curl -fsSL \
            "https://proxy.golang.org/${ENCODED_MODULE}/@v/${VERSION}.zip" \
            -o go-module.zip || true
          # If the zip isn't available from the proxy yet, create a local zip
          if [ ! -f go-module.zip ] || [ ! -s go-module.zip ]; then
            echo "Proxy zip not yet available; creating local archive instead"
            zip -r go-module.zip go/
          fi
          echo "Module zip size: $(wc -c < go-module.zip) bytes"

      - name: Sign Go module zip (keyless, Sigstore Fulcio + Rekor)
        # cosign uses the GitHub Actions OIDC token — no long-lived key secret.
        # The resulting bundle contains the certificate chain and
        # transparency-log entry needed to verify the signature.
        run: |
          cosign sign-blob \
            --yes \
            --bundle=go-module.zip.bundle \
            go-module.zip

      - name: Verify signature
        run: |
          cosign verify-blob \
            --bundle=go-module.zip.bundle \
            --certificate-identity-regexp='https://github.com/(?i:atlasent)/atlasent-sdk/.github/workflows/publish-go.yml@refs/tags/go/v.*' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            go-module.zip

      - name: Upload signature bundle to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            go-module.zip.bundle \
            --clobber

      - name: Summary
        run: |
          echo "## Go SDK Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`${{ steps.version.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Module | \`github.com/Atlasent/atlasent-sdk/go\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| pkg.go.dev | https://pkg.go.dev/github.com/Atlasent/atlasent-sdk/go@${{ steps.version.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cosign bundle | \`go-module.zip.bundle\` (attached to GitHub release) |" >> "$GITHUB_STEP_SUMMARY"
