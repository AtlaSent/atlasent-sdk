name: Publish @atlasent/behavior to npm

# Triggers on behavior-v1.* tags (e.g. behavior-v1.0.0, behavior-v1.0.1).
# Also triggers on v2.* tags for @atlasent/sdk stable releases.
#
# Tag conventions:
#   @atlasent/sdk releases:      typescript-v<semver>   (e.g. typescript-v2.0.0)
#   @atlasent/behavior releases:  behavior-v<semver>     (e.g. behavior-v1.0.0)
#
# Release procedure: bump version in the relevant package.json, commit,
# then push the matching tag. This workflow verifies the tag matches
# package.json before publishing.
on:
  push:
    tags:
      - "behavior-v1.*"
      - "behavior-v2.*"
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (sdk or behavior)'
        required: true
        default: 'behavior'
        type: choice
        options:
          - sdk
          - behavior
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true


permissions:
  contents: read

jobs:
  # ── Determine which package to publish ─────────────────────────────────────────────
  resolve:
    name: Resolve package from tag
    runs-on: ubuntu-latest
    outputs:
      package_dir: ${{ steps.resolve.outputs.package_dir }}
      package_name: ${{ steps.resolve.outputs.package_name }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
    steps:
      - name: Resolve package and dist-tag from trigger
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PKG="${{ github.event.inputs.package }}"
          else
            # Tag-based: behavior-v* → behavior package
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" == behavior-v* ]]; then
              PKG="behavior"
            else
              echo "::error::Unrecognised tag pattern: $TAG"
              exit 1
            fi
          fi

          if [ "$PKG" = "behavior" ]; then
            echo "package_dir=typescript/packages/behavior-emit" >> "$GITHUB_OUTPUT"
            echo "package_name=@atlasent/behavior-emit" >> "$GITHUB_OUTPUT"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          elif [ "$PKG" = "sdk" ]; then
            echo "package_dir=typescript" >> "$GITHUB_OUTPUT"
            echo "package_name=@atlasent/sdk" >> "$GITHUB_OUTPUT"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown package: $PKG"
            exit 1
          fi

  # ── Test ──────────────────────────────────────────────────────────────
  test:
    name: Test ${{ needs.resolve.outputs.package_name }}
    runs-on: ubuntu-latest
    needs: resolve
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]
    defaults:
      run:
        working-directory: ${{ needs.resolve.outputs.package_dir }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ needs.resolve.outputs.package_dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        # @atlasent/behavior has no separate test script yet; skip gracefully
        continue-on-error: ${{ needs.resolve.outputs.package_name == '@atlasent/behavior' }}

      - name: Build
        run: npm run build

  # ── Publish ──────────────────────────────────────────────────────────────
  publish:
    name: Publish ${{ needs.resolve.outputs.package_name }} to npm
    runs-on: ubuntu-latest
    needs: [resolve, test]
    environment: npm
    # id-token: write is required for:
    #   1. `npm publish --provenance` (Sigstore-backed npm provenance).
    #   2. cosign keyless signing (Sigstore Fulcio + Rekor, R4).
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ needs.resolve.outputs.package_dir }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: ${{ needs.resolve.outputs.package_dir }}/package-lock.json
          registry-url: "https://registry.npmjs.org"

      # ── AtlaSent release gate ────────────────────────────────────────
      # Gate closed: if the permit is not verified the job exits here and
      # nothing builds or publishes.
      # This was previously gated on `production.deploy`, the wrong
      # protected action for package publication (same release-control
      # inconsistency corrected in publish-npm.yml/publish-pypi.yml —
      # see those files' comments). Corrected here to match, rather than
      # left in a permanently-guaranteed-deny state.
      - name: AtlaSent release gate

        uses: Atlasent/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          action: package.release
          api-url: https://kttccumlnmdtupgbyfue.supabase.co/functions/v1
          actor: ${{ github.actor }}
          environment: production
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}"}'


      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        # Strips the package-prefix from the tag and compares against
        # package.json "version". Refuses to publish if they disagree.
        # Skipped for workflow_dispatch runs (no tag ref).
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Strip known prefixes: behavior-v, typescript-v
          TAG_VERSION="${TAG#behavior-v}"
          TAG_VERSION="${TAG_VERSION#typescript-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi
          echo "Tag and package version agree: $PKG_VERSION"

      - name: Verify manual version matches package version
        if: github.event_name == 'workflow_dispatch'
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Input version ($INPUT_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi
          # The AtlaSent release gate above reads context.ref from
          # github.ref directly (not from this version input), and the
          # org's package.release policy for this workflow requires a
          # tag ref matching this file's own documented conventions
          # (behavior-v<semver> for the behavior package, typescript-v<semver>
          # for sdk -- see the header comment). A dispatch from a non-tag
          # ref (e.g. main) whose package.json happens to already read the
          # target version would pass the check above yet still fail
          # downstream with a confusing gate denial, since github.ref never
          # matched a tag. Fail here instead, with an actionable error.
          case "${{ github.event.inputs.package }}" in
            behavior) EXPECTED_REF="refs/tags/behavior-v${INPUT_VERSION}" ;;
            sdk) EXPECTED_REF="refs/tags/typescript-v${INPUT_VERSION}" ;;
            *)
              echo "::error::Unknown package input: ${{ github.event.inputs.package }}"
              exit 1
              ;;
          esac
          if [ "${{ github.ref }}" != "$EXPECTED_REF" ]; then
            echo "::error::workflow_dispatch must be run FROM the release tag $EXPECTED_REF (select it as the dispatch ref), not from a branch. Got ${{ github.ref }}."
            exit 1
          fi
          echo "Input and package version agree: $PKG_VERSION"

      - name: Build
        run: npm run build

      - name: Pack tarball for signing
        # Create the real tarball so cosign can sign it before we publish.
        run: npm pack

      # ── R4: cosign keyless signing ─────────────────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign npm tarball (keyless, Sigstore Fulcio + Rekor)
        run: |
          TARBALL="$(ls *.tgz | head -1)"
          cosign sign-blob \
            --yes \
            --bundle="${TARBALL}.bundle" \
            "${TARBALL}"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Verify signature
        run: |
          cosign verify-blob \
            --bundle="${TARBALL}.bundle" \
            --certificate-identity-regexp='https://github.com/(?i:atlasent)/atlasent-sdk/.github/workflows/publish-npm-behavior.yml@refs/(heads/main|tags/(behavior|typescript)-v.*)' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            "${TARBALL}"

      - name: Upload signature bundle as workflow artifact
        # continue-on-error: artifact upload is best-effort; never block publish
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          # Use package_dir (no special chars) as the artifact name key;
          # package_name contains @ and / which are invalid in artifact names.
          name: npm-tarball-cosign-bundle-${{ needs.resolve.outputs.package_dir }}
          path: ${{ needs.resolve.outputs.package_dir }}/${{ env.TARBALL }}.bundle
          retention-days: 90

      - name: Inspect tarball contents (dry-run)
        # Logs the exact file list that would ship to the registry.
        # Lets a reviewer catch a missing dist/ or accidentally-included secret
        # before the package hits npm.
        run: npm pack --dry-run

      # npm trusted publishing (OIDC): npm authenticates this workflow via the
      # job's id-token (already granted for provenance/cosign), so no NPM_TOKEN.
      # Requires npm >= 11.5.1 and a Trusted Publisher configured for this
      # package on npmjs.com (repo Atlasent/atlasent-sdk, this workflow file,
      # this job's environment).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Publish (with provenance)
        run: npm publish --access public --provenance --tag ${{ needs.resolve.outputs.dist_tag }}
